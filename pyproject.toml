[project]
name = "retail-cosmology-plots"
version = "0.0.0"
description = "retail-cosmology の図を描くスクリプト（計算は Rust 側）"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
